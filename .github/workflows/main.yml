
name: Build RadioPro APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project
        run: unzip -o RadioPro_Android_Project.zip -d project

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle -p project/RadioPro_Android assembleDebug

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: RadioPro-APK
          path: project/RadioPro_Android/app/build/outputs/apk/debug/app-debug.apk
